services:
  - type: web
    name: safi-check
    runtime: python
    plan: free
    buildCommand: |
      apt-get update
      apt-get install -y curl gnupg unixodbc-dev g++ gcc python3-dev
      curl https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
      curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list > /etc/apt/sources.list.d/mssql-release.list
      apt-get update
      ACCEPT_EULA=Y apt-get install -y msodbcsql18
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DB_SERVER
        value: safisanadb.database.windows.net
      - key: DB_NAME
        value: safidb
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MOCK_MODE
        value: True
