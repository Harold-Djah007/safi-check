<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safi-Check • Daily Check-In</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="theme-color" content="#667eea">

<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
}
.particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
}
.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    animation: float 20s infinite;
}
@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-100px) rotate(180deg); }
}
.container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.checkin-card {
    max-width: 700px;
    width: 100%;
    background: rgba(255, 255, 255, 0.98);
    border-radius: 32px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    overflow: hidden;
}
.card-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 32px;
    text-align: center;
    color: white;
}
.card-body { padding: 40px; }

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}
.logo i { font-size: 32px; }
.logo span { font-size: 24px; font-weight: 700; }

.location-badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.15);
    padding: 8px 16px;
    border-radius: 50px;
    font-size: 13px;
    margin-top: 12px;
}
.badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.2);
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 12px;
    margin-top: 16px;
}

.mood-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
    margin-bottom: 32px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
}
.mood-option {
    text-align: center;
    padding: 40px 20px;
    border-radius: 24px;
    cursor: pointer;
    transition: all 0.3s;
    background: #f9fafb;
    border: 3px solid transparent;
    font-size: 60px;
}
.mood-option:hover { 
    transform: translateY(-6px) scale(1.02); 
    background: #f3f4f6;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
}
.mood-option.selected {
    border-color: #667eea;
    background: linear-gradient(135deg, rgba(102,126,234,0.15) 0%, rgba(118,75,162,0.15) 100%);
    transform: scale(1.02);
}

.issues-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
}
.issue-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #f9fafb;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid #e5e7eb;
}
.issue-chip:hover { background: #f3f4f6; border-color: #667eea; }
.issue-chip input { cursor: pointer; margin-right: 6px; }

.form-group { margin-bottom: 24px; }
label { display: block; font-weight: 600; color: #374151; margin-bottom: 8px; }
textarea {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    transition: all 0.3s;
    resize: vertical;
}
textarea:focus { outline: none; border-color: #667eea; }

.btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 20px;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px -5px rgba(102,126,234,0.4);
}
.btn-primary:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}
.btn-retry {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    background: white;
    color: #667eea;
    border: 2px solid #667eea;
    border-radius: 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: none;
}

.success-message { text-align: center; padding: 40px 0; }
.success-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
}
.success-icon i { font-size: 40px; color: white; }

.card-footer {
    padding: 20px 40px 32px;
    border-top: 1px solid #e5e7eb;
    text-align: center;
}
.footer-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    font-size: 12px;
    color: #9ca3af;
}

.loading {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid #fff;
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 0.6s linear infinite;
    margin-left: 8px;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 640px) {
    .card-body { padding: 24px; }
    .mood-option { font-size: 40px; padding: 24px 16px; }
}
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<div class="container">
<div class="checkin-card">

<div class="card-header">
    <div class="logo">
        <i class="fas fa-chart-line"></i>
        <span>Safi-Check</span>
    </div>
    <p>Your voice matters • Anonymous</p>
    
    <div class="location-badge" id="locationBadge">
        <i class="fas fa-map-marker-alt"></i>
        <span id="locationText">Detecting your location...</span>
    </div>
    
    <div class="badge">
        <i class="fas fa-lock"></i> 100% Anonymous & Secure
    </div>
</div>

<div class="card-body">

<form id="checkinForm">
    <h1>How was your day?</h1>
    <p class="subtitle" style="color: #6b7280; margin-bottom: 32px; text-align: center;">Select how you feel</p>
    
    <div class="mood-grid">
        <div class="mood-option" data-mood="👍 Thumbs Up">👍</div>
        <div class="mood-option" data-mood="👎 Thumbs Down">👎</div>
    </div>
    
    <input type="hidden" name="mood" id="moodInput">
    <input type="hidden" name="location" id="locationInput">
    <input type="hidden" name="latitude" id="latitudeInput">
    <input type="hidden" name="longitude" id="longitudeInput">

    <!-- Comments section - Always visible, optional -->
    <div class="form-group">
        <label><i class="fas fa-comment"></i> Tell us more <span style="color: #6b7280; font-weight: normal;">(Optional)</span></label>
        <textarea name="comments" rows="4" placeholder="Share your thoughts, feedback, or suggestions..."></textarea>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn" disabled>
        Waiting for location... <span class="loading"></span>
    </button>
    <button type="button" class="btn-retry" id="retryLocationBtn">
        <i class="fas fa-location-arrow"></i> Allow location
    </button>
</form>

<div id="successMessage" style="display: none;">
    <div class="success-message">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h3>Thank You!</h3>
        <p>Your feedback has been recorded anonymously.</p>
        <button id="doneBtn" class="btn-primary" style="margin-top: 24px;">Done</button>
    </div>
</div>

</div>

<div class="card-footer">
    <div class="footer-stats">
        <span><i class="fas fa-shield-alt"></i> Anonymous</span>
        <span><i class="fas fa-clock"></i> Takes 30 sec</span>
        <span><i class="fas fa-chart-line"></i> Helps improve workplace</span>
    </div>
</div>

</div>
</div>

<script>
// Particles animation
const particlesContainer = document.getElementById("particles");
if (particlesContainer) {
    for (let i = 0; i < 50; i++) {
        let p = document.createElement("div");
        p.className = "particle";
        p.style.width = Math.random() * 6 + 2 + "px";
        p.style.height = p.style.width;
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "%";
        p.style.animationDelay = Math.random() * 20 + "s";
        p.style.animationDuration = 15 + Math.random() * 20 + "s";
        particlesContainer.appendChild(p);
    }
}

let selectedMood = null;
let locationReady = false;
let submitting = false;

// ================= LOCATION DETECTION =================
// Submit stays locked until GPS maps to a site. Coords are mapped on the
// device (no extra network) so Kumasi is not stored as Ashaiman on a bad
// connection. Accra metro → Ashaiman, Kumasi → Kumasi, Weesp → Weesp.
const STORE_LOCATIONS = ["Ashaiman", "Kumasi", "Weesp"];
const REGION_BOXES = [
    { name: "Kumasi", minLat: 6.50, maxLat: 6.95, minLon: -1.85, maxLon: -1.35 },
    { name: "Weesp", minLat: 52.20, maxLat: 52.50, minLon: 4.70, maxLon: 5.30 },
    { name: "Ashaiman", minLat: 5.28, maxLat: 5.92, minLon: -0.55, maxLon: 0.22 }
];
const CACHE_KEY = "safi_location_cache_v2";
const CACHE_TIME = 1000 * 60 * 10;

function locationFromCoords(lat, lon) {
    const latitude = Number(lat);
    const longitude = Number(lon);
    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;
    for (const box of REGION_BOXES) {
        if (
            latitude >= box.minLat && latitude <= box.maxLat &&
            longitude >= box.minLon && longitude <= box.maxLon
        ) {
            return box.name;
        }
    }
    return null;
}

function setLocationStatus(message, spinning) {
    const text = document.getElementById("locationText");
    const icon = spinning
        ? '<i class="fas fa-spinner fa-spin"></i>'
        : '<i class="fas fa-map-marker-alt"></i>';
    text.innerHTML = `${icon} ${message}`;
}

function showRetry(show) {
    document.getElementById("retryLocationBtn").style.display = show ? "block" : "none";
}

function updateSubmitButton() {
    const btn = document.getElementById("submitBtn");
    if (submitting) return;
    if (!locationReady) {
        btn.disabled = true;
        btn.innerHTML = 'Waiting for location... <span class="loading"></span>';
        return;
    }
    btn.disabled = false;
    btn.innerHTML = 'Submit Check-in <i class="fas fa-paper-plane"></i>';
}

function confirmSite(name, lat, lon) {
    const input = document.getElementById("locationInput");
    const latInput = document.getElementById("latitudeInput");
    const lonInput = document.getElementById("longitudeInput");

    input.value = name;
    latInput.value = lat;
    lonInput.value = lon;
    locationReady = true;
    showRetry(false);
    setLocationStatus(name, false);
    updateSubmitButton();

    localStorage.setItem(CACHE_KEY, JSON.stringify({
        location: name,
        lat,
        lon,
        time: Date.now()
    }));
    console.log("📍 Location confirmed:", name, lat, lon);
}

function requestGps(options) {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            reject(Object.assign(new Error("Geolocation is not supported"), { code: 0 }));
            return;
        }
        navigator.geolocation.getCurrentPosition(resolve, reject, options);
    });
}

async function geolocationPermission() {
    try {
        if (!navigator.permissions || !navigator.permissions.query) return "unknown";
        const status = await navigator.permissions.query({ name: "geolocation" });
        return status.state;
    } catch (err) {
        return "unknown";
    }
}

async function captureGps(fromUserGesture) {
    const permission = await geolocationPermission();
    const options = {
        timeout: fromUserGesture ? 25000 : 15000,
        maximumAge: fromUserGesture ? 0 : 60000,
        enableHighAccuracy: !!fromUserGesture
    };

    try {
        return await requestGps(options);
    } catch (err) {
        if (fromUserGesture && err && err.code === 3) {
            return await requestGps({
                timeout: 20000,
                maximumAge: 0,
                enableHighAccuracy: false
            });
        }
        throw err;
    }
}

async function detectLocation(options = {}) {
    const skipCache = !!options.skipCache;
    const fromUserGesture = !!options.fromUserGesture;

    locationReady = false;
    document.getElementById("locationInput").value = "";
    document.getElementById("latitudeInput").value = "";
    document.getElementById("longitudeInput").value = "";
    updateSubmitButton();
    setLocationStatus("Detecting your location...", true);
    if (!fromUserGesture) showRetry(false);

    if (!skipCache) {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (cached && (Date.now() - cached.time < CACHE_TIME)) {
            const cachedSite = locationFromCoords(cached.lat, cached.lon);
            if (cachedSite) {
                confirmSite(cachedSite, cached.lat, cached.lon);
                console.log("📍 Using cached GPS location:", cachedSite);
                return;
            }
        }
    } else {
        localStorage.removeItem(CACHE_KEY);
    }

    try {
        const position = await captureGps(fromUserGesture);
        const { latitude, longitude } = position.coords;
        console.log("📍 GPS coordinates obtained:", latitude, longitude);

        let site = locationFromCoords(latitude, longitude);
        if (!site) {
            try {
                const resolved = await resolveOnServer({ latitude, longitude });
                if (STORE_LOCATIONS.includes(resolved)) site = resolved;
            } catch (err) {
                console.warn("GPS reverse lookup failed", err);
            }
        }

        if (site) {
            confirmSite(site, latitude, longitude);
            return;
        }

        setLocationStatus("Could not match this location. Retry.", false);
        showRetry(true);
    } catch (err) {
        console.warn("GPS attempt failed:", err && err.message ? err.message : err);
        const denied = err && err.code === 1;
        const permission = await geolocationPermission();
        if (denied || permission === "denied") {
            setLocationStatus("Allow location in the address-bar lock, then retry", false);
        } else {
            setLocationStatus("Turn on location to continue", false);
        }
        showRetry(true);
    }
}

async function retryLocation() {
    setLocationStatus("Allow location when asked...", true);
    showRetry(false);
    await detectLocation({ skipCache: true, fromUserGesture: true });
}

async function resolveOnServer(payload) {
    const res = await fetch("/resolve-location", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.success || !data.location) {
        throw new Error("resolve-location failed");
    }
    return data.location;
}

// ================= MOOD SELECTION =================
document.querySelectorAll(".mood-option").forEach(opt => {
    opt.addEventListener("click", () => {
        document.querySelectorAll(".mood-option").forEach(o => o.classList.remove("selected"));
        opt.classList.add("selected");
        selectedMood = opt.dataset.mood;
        document.getElementById("moodInput").value = selectedMood;
    });
});

// ================= FORM SUBMISSION =================
document.getElementById("retryLocationBtn").onclick = () => retryLocation();

function resetForm() {
    document.getElementById("checkinForm").reset();
    document.querySelectorAll(".mood-option").forEach(o => o.classList.remove("selected"));
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
    document.querySelectorAll('textarea').forEach(ta => ta.value = "");
    selectedMood = null;
    document.getElementById("moodInput").value = "";
    document.getElementById("checkinForm").style.display = "block";
    document.getElementById("successMessage").style.display = "none";
    detectLocation();
}

document.getElementById("checkinForm").onsubmit = async (e) => {
    e.preventDefault();

    if (!locationReady) {
        alert("Please wait until your location is detected");
        return;
    }
    
    if (!selectedMood) {
        alert("Please select how you feel");
        return;
    }
    
    const locationValue = document.getElementById("locationInput").value;
    if (!STORE_LOCATIONS.includes(locationValue)) {
        alert("Please wait until your location is detected");
        return;
    }
    console.log("📤 Submitting with location:", locationValue);
    
    const submitBtn = document.getElementById("submitBtn");
    submitting = true;
    submitBtn.innerHTML = 'Submitting... <span class="loading"></span>';
    submitBtn.disabled = true;
    
    const formData = new FormData(e.target);
    
    try {
        const res = await fetch("/submit", { method: "POST", body: formData });
        const data = await res.json();
        
        if (data.success) {
            document.getElementById("checkinForm").style.display = "none";
            document.getElementById("successMessage").style.display = "block";
            console.log("✅ Submission successful with location:", locationValue);
        } else {
            alert(data.error || "Something went wrong");
        }
    } catch (error) {
        console.error("Submission error:", error);
        alert("Network error. Please try again.");
    } finally {
        submitting = false;
        updateSubmitButton();
    }
};

document.getElementById("doneBtn").onclick = () => {
    resetForm();
    document.getElementById("checkinForm").style.display = "block";
    document.getElementById("successMessage").style.display = "none";
};

// Initialize location detection
detectLocation();
</script>

</body>
</html>
